# Supabase project configuration.
# Minimal: only edge function overrides needed for TICKET-072.
# Other project settings are controlled by the linked Supabase project.

[db]
# Prod runs Postgres 17 (17.6.1.044). Pinned so local `supabase start` and the
# migration-replay CI guard can't drift onto a different major if a future CLI
# changes its default. Local-only setting; `config push` never sends it.
major_version = 17

[functions.share-page]
# Public URL renderer — no JWT required (iMessage/WhatsApp unfurl bots, browsers)
verify_jwt = false

[auth]
# TICKET-090: password-recovery emails 302 to these deep links. Without the
# allowlist entry Supabase falls back to site_url and the link dead-ends.
# Applied to prod via `npx supabase config push`.
additional_redirect_urls = ["napkin://reset-password", "diningjournalapp://reset-password"]
