name: edge-functions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.2

      - name: Guard table_members member id
        run: deno run --allow-read=. scripts/lint-tm-member-id.ts

      - name: Run hermetic Edge Function tests
        # Dependencies are integrity-checked by deno.lock. The test runtime gets
        # env access for test-owned fixtures, but deliberately no network access.
        run: deno test --allow-env --frozen supabase/functions/
