name: jest

on:
  pull_request:
    paths:
      - 'napkin-app/**'
      - 'scripts/check-typography.mjs'
      - 'scripts/typography-baseline.json'
      - 'docs/TYPOGRAPHY.md'
      - 'package.json'
      - '.github/workflows/jest.yml'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: napkin-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'napkin-app/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Check typography policy
        working-directory: ${{ github.workspace }}
        run: npm run check:typography

      - name: Run tests
        run: npm test -- --ci
