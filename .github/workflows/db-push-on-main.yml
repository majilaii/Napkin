name: Apply Migrations to Production

# Auto-applies new migrations to the linked Supabase project after merge to main.
#
# Why this exists: Three prod breakages in 48 hours from migrations committed
# to main but never pushed to remote. Removing the human "did you remember to
# push?" step closes the gap.
#
# Failure mode: If this job fails, main has migrations that are NOT on prod.
# Watch the Actions tab. Recovery: locally run
#   npx supabase db push --linked --project-ref ftvmseaqwwlcxtdlvxxz
# after fixing whatever broke (usually a duplicate timestamp or a constraint
# violation).
#
# Required repo secrets:
#   - SUPABASE_ACCESS_TOKEN  (must be set, or this job fails — that's the point)
#   - SUPABASE_DB_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

# Serialize: never run two pushes against the same remote concurrently.
concurrency:
  group: supabase-prod-push
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push --linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity check — duplicate timestamps
        run: bash scripts/check-migration-timestamps.sh

      - name: Verify secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set."
            echo "Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [[ -z "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to remote project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ftvmseaqwwlcxtdlvxxz --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations to remote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "## Migrations applied" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Failure note
        if: failure()
        run: |
          echo "::error::Migrations did NOT apply to remote. Main is now ahead of prod schema."
          echo "::error::Recovery: locally run \`npx supabase db push --linked --project-ref ftvmseaqwwlcxtdlvxxz\` after diagnosing the failure above."
