name: Deploy to Production

# Auto-deploys merged-to-main commits to production, then runs smoke tests.
# If smoke fails, ordinarily opens a revert PR. Forward-only bootstrap commits
# freeze/disable their new path and require a forward fix instead.
#
# This is Option 4 from the 2026-04-30 deploy doctrine review: no staging
# (Supabase free-tier project cap), so the safety net is fast detection +
# cheap revert. Trade-off: users may see ~30 sec of breakage between deploy
# and revert merge. Acceptable while in friends-test phase. Revisit when
# paying $25/mo for Supabase Pro becomes worth it (= real users).
#
# Triggered only on changes to migrations or edge functions — pure client
# changes don't deploy here.
#
# Required repo secrets:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_DB_PASSWORD            (prod password)
#   - PROD_ANON_KEY                   (anon key for prod)
#   - PROD_SMOKE_TEST_EMAIL           (smoke user on prod — signs in at runtime)
#   - PROD_SMOKE_TEST_PASSWORD
#   - PROD_SMOKE_TEST_RESTAURANT_ID
#   - SUPABASE_SERVICE_ROLE_KEY        (cron transport + deploy gate)
#   - COMPLETENESS_CRON_SECRET         (shared only by CI and the Edge runtime)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      # The smoke suite guards prod; a change to it (or to this workflow)
      # must prove itself against prod immediately, not lie dormant until
      # the next backend deploy.
      - 'scripts/smoke/**'
      - '.github/workflows/prod-deploy.yml'
      - '.github/workflows/restaurant-completeness-cron.yml'
  # Manual re-run: db push is idempotent, fn detection diffs HEAD~1 (usually
  # nothing), so a bare dispatch is effectively "run the smoke suite against
  # prod". The `functions` input force-deploys named functions — the recovery
  # lever for a run that failed AFTER db push but BEFORE the fn-deploy step
  # (first needed 2026-07-10: the cron gate aborted on a wrong pooler host and
  # stranded TICKET-159's three functions on their old bundles).
  workflow_dispatch:
    inputs:
      functions:
        description: "Force-deploy these edge functions (comma-separated), or 'all'. Skips the commit-range diff."
        required: false
        default: ''

concurrency:
  group: supabase-prod-deploy
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Deploy to production + smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the auto-revert branch
      pull-requests: write  # needed to open the auto-revert PR
    defaults:
      run:
        # `shell: bash` = `bash -eo pipefail` (vs the default `bash -e`).
        # Load-bearing: db push, fn deploy, and smoke all pipe through
        # `tee`, and without pipefail a failing left side exits 0 — smoke
        # "passed" for four straight deploys on 2026-07-04 while deno was
        # crashing on startup. Every step here must fail loudly.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The rollout classifier and function detector inspect the complete
          # push range, not just the last commit. Logical multi-commit merges
          # must not hide an earlier migration or shared-function change.
          fetch-depth: 0

      - name: Classify forward-only bootstrap release
        id: rollout-mode
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          base_ref="${PUSH_BEFORE:-HEAD~1}"
          head_ref="${PUSH_HEAD:-HEAD}"
          if [[ "$base_ref" =~ ^0+$ ]] || ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
            base_ref=HEAD~1
          fi
          forward_only=$(bash scripts/classify-forward-only-release.sh "$base_ref" "$head_ref")
          if [[ "$forward_only" != 'true' && "$forward_only" != 'false' ]]; then
            echo "::error::Unexpected forward-only classifier output: $forward_only"
            exit 1
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "forward_only=$forward_only" >> "$GITHUB_OUTPUT"
          echo "Forward-only bootstrap release: $forward_only" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROD_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          PROD_SMOKE_TEST_EMAIL: ${{ secrets.PROD_SMOKE_TEST_EMAIL }}
          PROD_SMOKE_TEST_PASSWORD: ${{ secrets.PROD_SMOKE_TEST_PASSWORD }}
          PROD_SMOKE_TEST_RESTAURANT_ID: ${{ secrets.PROD_SMOKE_TEST_RESTAURANT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
        run: |
          missing=()
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROD_ANON_KEY PROD_SMOKE_TEST_EMAIL PROD_SMOKE_TEST_PASSWORD PROD_SMOKE_TEST_RESTAURANT_ID SUPABASE_SERVICE_ROLE_KEY COMPLETENESS_CRON_SECRET; do
            if [[ -z "${!v:-}" ]]; then missing+=("$v"); fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Duplicate timestamp guard
        run: bash scripts/check-migration-timestamps.sh

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deno 2.x required: the repo's deno.lock is lockfile v5, which Deno 1.x
      # cannot read — `deno run` crashed on startup ("Unsupported lockfile
      # version '5'") in every smoke step since the lockfile landed, and the
      # missing pipefail (fixed above) hid it.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Link to prod project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref ftvmseaqwwlcxtdlvxxz --password "$SUPABASE_DB_PASSWORD"

      # Forward-only bootstrap (TICKET-195 delta 5). This runs before the first
      # migration exists, so it may only touch Edge secrets. The additive
      # migration seeds the DB freeze itself; later deploys additionally freeze
      # the already-present control row below on a best-effort basis.
      - name: Disable completeness worker before rollout
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
        run: |
          supabase secrets set \
            COMPLETENESS_WORKER_ENABLED=false \
            COMPLETENESS_SPEND_FROZEN=true \
            COMPLETENESS_CRON_SECRET="$COMPLETENESS_CRON_SECRET" \
            --project-ref ftvmseaqwwlcxtdlvxxz

      - name: Freeze an existing completeness rollout (bootstrap-safe)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          code=$(curl --silent --show-error -o /tmp/completeness-pre-freeze.json -w '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_frozen":true,"p_reason":"rollout"}' \
            https://ftvmseaqwwlcxtdlvxxz.supabase.co/rest/v1/rpc/fn_set_completeness_freeze || true)
          if [[ "$code" =~ ^2 ]]; then
            echo "Existing completeness control frozen before migration."
          else
            echo "Bootstrap: freeze RPC is not present yet (HTTP $code); the additive migration will seed frozen=true."
          fi

      # Provision against the pre-existing prod schema/functions BEFORE any
      # deployment. The diary/reviews keyset walks need ≥2 review-bearing
      # entries, and feed-socials needs its second public saver. Both fixture
      # sets are idempotent. A provisioning failure is a pre-deploy gate: the
      # job stops here with migrations and edge functions still untouched.
      - name: Ensure smoke fixtures (keyset walk needs ≥2 entries)
        env:
          SUPABASE_URL: https://ftvmseaqwwlcxtdlvxxz.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          SMOKE_TEST_EMAIL: ${{ secrets.PROD_SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.PROD_SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_RESTAURANT_ID: ${{ secrets.PROD_SMOKE_TEST_RESTAURANT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
        run: |
          deno run --allow-env --allow-net scripts/smoke/ensure-fixtures.ts 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push migrations to prod
        id: push-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "## Migrations applied to PROD" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Assert database completeness freeze after migration
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_frozen":true,"p_reason":"rollout"}' \
            https://ftvmseaqwwlcxtdlvxxz.supabase.co/rest/v1/rpc/fn_set_completeness_freeze

      # ── TICKET-159: pg_cron gate — the gathering sweep MUST be scheduled ──
      # The migration's cron.schedule block is extension-guarded so from-scratch
      # replays stay green, which means a prod without pg_cron would silently
      # no-op the hourly sweep. This gate makes that state a deploy FAILURE
      # (→ ordinary releases open an auto-revert PR; the forward-only
      # completeness bootstrap freezes/disables for a forward fix). On-read dispatch
      # is defense-in-depth, never the excuse for an unscheduled sweep.
      # Connects via the Supavisor session pooler (GitHub runners are IPv4-only;
      # the direct db.<ref> host is IPv6). The pooler INSTANCE NUMBER varies per
      # project (aws-0/aws-1/… — the 2026-07-10 first run guessed aws-0 and got
      # "tenant not found"), so the host comes from the Management API's pooler
      # config, with instance-number probing as fallback. Still fail-closed: no
      # reachable pooler, or job absent → deploy failure under that same policy.
      - name: Verify gathering sweep is scheduled (pg_cron gate)
        id: cron-gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ftvmseaqwwlcxtdlvxxz
        run: |
          # Preferred: the project's actual pooler host from the Management API.
          api_host=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" \
            | grep -oE '[a-z0-9-]+\.pooler\.supabase\.com' | head -1 || true)
          region=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.region')
          candidates=()
          [[ -n "$api_host" ]] && candidates+=("$api_host")
          if [[ -n "$region" && "$region" != "null" ]]; then
            for n in 0 1 2; do candidates+=("aws-${n}-${region}.pooler.supabase.com"); done
          fi
          if [[ ${#candidates[@]} -eq 0 ]]; then
            echo "::error::cron gate: could not derive any pooler host from the Management API."
            exit 1
          fi
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          present=""
          for h in "${candidates[@]}"; do
            if out=$(psql "postgresql://postgres.${PROJECT_REF}@${h}:5432/postgres" \
                -tAc "select count(*) from cron.job where jobname = 'gathering-sweep'" 2>/dev/null); then
              echo "pooler host: ${h} · cron.job rows named gathering-sweep: ${out}" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              present="$out"
              break
            fi
          done
          if [[ -z "$present" ]]; then
            echo "::error::cron gate: no pooler host reachable (tried: ${candidates[*]})."
            exit 1
          fi
          if [[ "$present" != "1" ]]; then
            echo "::error::cron gate FAILED: pg_cron job 'gathering-sweep' is not scheduled on prod. Enable pg_cron / re-apply 20260711090000, or revert."
            exit 1
          fi

      - name: Identify changed edge functions (vs previous main commit)
        id: changed-fns
        env:
          # workflow_dispatch force-deploy list (empty on push). Passed through
          # env — never interpolated into the script — and validated against
          # the real function directories below.
          FORCE_FNS: ${{ inputs.functions }}
          DIFF_BASE: ${{ steps.rollout-mode.outputs.base_ref }}
          DIFF_HEAD: ${{ steps.rollout-mode.outputs.head_ref }}
        run: |
          if [[ -n "$FORCE_FNS" ]]; then
            if [[ "$FORCE_FNS" == "all" ]]; then
              changed=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' \
                -exec basename {} \; | sort)
            else
              changed=$(echo "$FORCE_FNS" | tr ',' '\n' | tr -d ' ' | grep -v '^$' | sort -u)
              while IFS= read -r f; do
                if [[ ! -d "supabase/functions/$f" ]]; then
                  echo "::error::force-deploy: unknown edge function '$f'"
                  exit 1
                fi
              done <<< "$changed"
            fi
            echo "workflow_dispatch force-deploy: $(echo $changed | tr '\n' ' ')" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "fns=$(echo $changed | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_paths=$(git diff --name-only "$DIFF_BASE" "$DIFF_HEAD" -- 'supabase/functions/**')

          # _shared/** modules and top-level files (import_map.json) are baked
          # into every function's bundle at deploy time — they are not deployed
          # on their own. A commit touching only those must redeploy the whole
          # fleet, or live bundles keep the old shared code until each function
          # is next redeployed for an unrelated reason.
          if echo "$diff_paths" | grep -Eq '^supabase/functions/(_|[^/]+$)'; then
            echo "Shared code changed — redeploying ALL edge functions." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            changed=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' \
              -exec basename {} \; | sort)
          else
            changed=$(echo "$diff_paths" \
              | awk -F/ '/^supabase\/functions\/[^_]/ {print $3}' \
              | sort -u \
              | grep -v '^$' || true)
          fi
          if [[ -z "$changed" ]]; then
            echo "fns=" >> "$GITHUB_OUTPUT"
          else
            echo "fns=$(echo $changed | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy changed edge functions to prod
        id: deploy-fns
        if: steps.changed-fns.outputs.fns != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          echo "## Edge functions deployed to PROD" >> "$GITHUB_STEP_SUMMARY"
          # Deploy the WHOLE fleet even when one function fails. Aborting
          # mid-loop (bare `deploy | tee` under -e -o pipefail) leaves the
          # functions deployed before the failure on new _shared code while
          # the rest keep the old bundle — split-brain — and skips smoke, so
          # the auto-revert PR never opens. The `if !` wrapper keeps pipefail
          # semantics per pipeline while letting the loop finish; failures
          # are collected and the step exits non-zero at the end.
          failed=()
          for fn in ${{ steps.changed-fns.outputs.fns }}; do
            echo "### $fn" >> "$GITHUB_STEP_SUMMARY"
            if ! supabase functions deploy "$fn" --project-ref ftvmseaqwwlcxtdlvxxz 2>&1 \
              | tee -a "$GITHUB_STEP_SUMMARY"; then
              failed+=("$fn")
              echo "::error::Edge function deploy FAILED: $fn"
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "failed_fns=${failed[*]}" >> "$GITHUB_OUTPUT"
            echo "**FAILED to deploy (still on the previous bundle):** ${failed[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Smoke test prod
        id: smoke
        # Runs on full success AND when the fleet deploy failed partway —
        # smoke must exercise whatever mix of bundles is actually live so a
        # broken prod still trips the auto-revert PR. (Deliberately NOT
        # `always()`: a migration-push failure still skips smoke as before.)
        if: success() || steps.deploy-fns.outcome == 'failure'
        env:
          SUPABASE_URL: https://ftvmseaqwwlcxtdlvxxz.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          SMOKE_TEST_EMAIL: ${{ secrets.PROD_SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.PROD_SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_RESTAURANT_ID: ${{ secrets.PROD_SMOKE_TEST_RESTAURANT_ID }}
          # Completeness spend is still frozen during ordinary smoke. The
          # post-enable item gate below owns paid-path readiness; do not make a
          # deliberately frozen Google call fail this bootstrap phase.
          PLACES_SMOKE: "0"
          # TICKET-196 B-0 ships the real-provider gate dark. The founder flips
          # this repo variable only after GOOGLE_VISION_API_KEY is provisioned;
          # from then on every backend deploy must pass the reserved canary.
          IMAGE_MODERATION_CANARY: ${{ vars.IMAGE_MODERATION_CANARY_ACTIVE == 'true' && '1' || '0' }}
          MODERATION_CRON_TOKEN: ${{ secrets.MODERATION_CRON_TOKEN }}
        run: |
          echo "## Smoke test results (PROD)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          deno run --allow-env --allow-net scripts/smoke/edge-functions.ts 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Completeness bootstrap smoke (forward-only)
        id: completeness-smoke
        if: success()
        env:
          SUPABASE_URL: https://ftvmseaqwwlcxtdlvxxz.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
          SMOKE_TEST_EMAIL: ${{ secrets.PROD_SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.PROD_SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_RESTAURANT_ID: ${{ secrets.PROD_SMOKE_TEST_RESTAURANT_ID }}
        run: |
          echo "## Completeness bootstrap smoke (forward-only)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          deno run --allow-env --allow-net scripts/smoke/restaurant-completeness.ts 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The worker is default-inert through migration, function deployment, and
      # ordinary smoke. Only after all three pass do we enable it and clear the
      # authoritative DB freeze. A gate failure is a forward-fix incident: the
      # restoration step below freezes/disables the new path and deliberately
      # does not whole-SHA-revert migrations or workflow files.
      - name: Enable completeness worker for post-deploy gate
        id: completeness-enable
        if: success()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
        run: |
          supabase secrets set \
            COMPLETENESS_WORKER_ENABLED=true \
            COMPLETENESS_SPEND_FROZEN=false \
            COMPLETENESS_CRON_SECRET="$COMPLETENESS_CRON_SECRET" \
            --project-ref ftvmseaqwwlcxtdlvxxz
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_frozen":false,"p_reason":"post-deploy gate"}' \
            https://ftvmseaqwwlcxtdlvxxz.supabase.co/rest/v1/rpc/fn_set_completeness_freeze

      # The item-to-terminal gate below deliberately uses an already-complete
      # restaurant and therefore proves no paid provider path. Keep one real,
      # fixed Text Search after the authoritative DB freeze has been cleared so
      # a bad Google key, SKU-budget wiring, or stale frozen state cannot ship.
      - name: Completeness paid-path readiness gate
        id: completeness-paid-gate
        if: success()
        env:
          SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          SMOKE_TEST_EMAIL: ${{ secrets.PROD_SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.PROD_SMOKE_TEST_PASSWORD }}
        run: |
          auth=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg email "$SMOKE_TEST_EMAIL" --arg password "$SMOKE_TEST_PASSWORD" '{email:$email,password:$password}')" \
            'https://ftvmseaqwwlcxtdlvxxz.supabase.co/auth/v1/token?grant_type=password')
          jwt=$(jq -er '.access_token' <<< "$auth")
          owner_id=$(jq -er '.user.id' <<< "$auth")
          payload=$(jq -cn --arg owner_id "$owner_id" \
            '{query:"blue bottle coffee san francisco",limit:1,expected_owner_id:$owner_id}')

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $jwt" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            https://ftvmseaqwwlcxtdlvxxz.supabase.co/functions/v1/places-search \
            | jq -e '.data | type == "array" and length > 0 and (.[0].id | type == "string")'

      - name: Completeness item-to-terminal gate
        id: completeness-gate
        if: success()
        env:
          SUPABASE_ANON_KEY: ${{ secrets.PROD_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
          SMOKE_TEST_EMAIL: ${{ secrets.PROD_SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.PROD_SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_RESTAURANT_ID: ${{ secrets.PROD_SMOKE_TEST_RESTAURANT_ID }}
        run: |
          auth=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            --data "$(jq -cn --arg email "$SMOKE_TEST_EMAIL" --arg password "$SMOKE_TEST_PASSWORD" '{email:$email,password:$password}')" \
            'https://ftvmseaqwwlcxtdlvxxz.supabase.co/auth/v1/token?grant_type=password')
          owner_id=$(jq -er '.user.id' <<< "$auth")
          import_nonce=$(cat /proc/sys/kernel/random/uuid)
          payload=$(jq -cn \
            --arg owner_id "$owner_id" \
            --arg restaurant_id "$SMOKE_TEST_RESTAURANT_ID" \
            --arg import_nonce "$import_nonce" \
            '{action:"deploy_gate",owner_id:$owner_id,restaurant_id:$restaurant_id,import_nonce:$import_nonce}')

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-completeness-cron: $COMPLETENESS_CRON_SECRET" \
            --data "$payload" \
            https://ftvmseaqwwlcxtdlvxxz.supabase.co/functions/v1/restaurant-completeness \
            | jq -e '.data.terminal == true and (.data.state == "verified" or .data.state == "resolved")'

      - name: Restore completeness freeze after any interrupted rollout
        # `failure()` does not run after workflow cancellation. Keep this step on
        # the always() path and leave completeness live only after the terminal
        # gate has positively succeeded.
        if: ${{ always() && steps.completeness-gate.outcome != 'success' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMPLETENESS_CRON_SECRET: ${{ secrets.COMPLETENESS_CRON_SECRET }}
          MIGRATION_STEP_OUTCOME: ${{ steps.push-migrations.outcome }}
        run: |
          restore_failures=()
          if supabase secrets set \
              COMPLETENESS_WORKER_ENABLED=false \
              COMPLETENESS_SPEND_FROZEN=true \
              COMPLETENESS_CRON_SECRET="$COMPLETENESS_CRON_SECRET" \
              --project-ref ftvmseaqwwlcxtdlvxxz; then
            echo "Completeness Edge worker disabled and provider spend frozen."
          else
            restore_failures+=("Edge worker disable/freeze")
          fi

          freeze_rc=0
          freeze_code=$(curl --silent --show-error \
            -o /tmp/completeness-restore-freeze.json -w '%{http_code}' \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"p_frozen":true,"p_reason":"rollout failed"}' \
            https://ftvmseaqwwlcxtdlvxxz.supabase.co/rest/v1/rpc/fn_set_completeness_freeze) \
            || freeze_rc=$?
          if [[ "$freeze_rc" == '0' && "$freeze_code" =~ ^2 ]]; then
            echo "Completeness database budget frozen."
          elif [[ "$MIGRATION_STEP_OUTCOME" != 'success' && "$freeze_code" == '404' ]]; then
            echo "Bootstrap restoration: freeze RPC is not installed yet; Edge disable is authoritative."
          else
            restore_failures+=("database freeze (curl=$freeze_rc HTTP=$freeze_code)")
            cat /tmp/completeness-restore-freeze.json 2>/dev/null || true
          fi

          if [[ ${#restore_failures[@]} -gt 0 ]]; then
            echo "::error::Completeness restoration FAILED: ${restore_failures[*]}"
            exit 1
          fi

      # ── If smoke failed, automatically open a revert PR ──────────────────
      # We do NOT auto-merge — you stay in the loop. But the diff is
      # one-click ready, so MTTR is the time it takes you to read the email
      # and click "Squash and merge".
      # TICKET-159: the cron gate is part of "smoke" for revert purposes — an
      # unscheduled sweep is a broken deploy and must open the same revert PR.
      - name: Open auto-revert PR on smoke failure
        if: failure() && steps.rollout-mode.outputs.forward_only != 'true' && (steps.smoke.conclusion == 'failure' || steps.cron-gate.conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BAD_SHA="${{ github.sha }}"
          BAD_SHORT=$(echo "$BAD_SHA" | cut -c1-7)
          BRANCH="auto-revert/${BAD_SHORT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          # Try -m 1 (merge commit case) first, fall back to plain revert.
          if ! git revert --no-edit -m 1 "$BAD_SHA" 2>/dev/null; then
            if ! git revert --no-edit "$BAD_SHA"; then
              echo "::error::git revert failed — manual intervention required."
              exit 1
            fi
          fi

          git push origin "$BRANCH"

          BODY=$(printf '%s\n' \
            "Production smoke tests failed immediately after deploying \`$BAD_SHORT\`." \
            "" \
            "This PR reverts that commit. **Review and merge ASAP** — every minute this stays open, users may be hitting errors." \
            "" \
            "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "After merging, investigate the smoke failure and ship a real fix on a new branch.")

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "🚨 Auto-revert: smoke tests failed on $BAD_SHORT" \
            --body "$BODY"

      - name: Failure note
        if: failure()
        env:
          FAILED_FNS: ${{ steps.deploy-fns.outputs.failed_fns }}
        run: |
          echo "::error::PROD deploy or smoke tests failed."
          if [[ -n "$FAILED_FNS" ]]; then
            echo "::error::Edge functions that FAILED to deploy (still on the OLD bundle): $FAILED_FNS"
          fi
          if [[ "${{ steps.completeness-smoke.conclusion }}" == "failure" || \
                "${{ steps.completeness-enable.conclusion }}" == "failure" || \
                "${{ steps.completeness-paid-gate.conclusion }}" == "failure" || \
                "${{ steps.completeness-gate.conclusion }}" == "failure" ]]; then
            echo "::error::Completeness rollout gate failed. The new path was frozen/disabled; preserve the additive migration and workflow, then forward-fix or selectively redeploy a known-good Edge bundle."
          elif [[ "${{ steps.rollout-mode.outputs.forward_only }}" == "true" ]]; then
            echo "::error::This is the forward-only completeness bootstrap. The new path was frozen/disabled; no whole-SHA auto-revert PR was opened. Preserve the migration and workflow, then forward-fix or selectively redeploy a known-good Edge bundle."
          else
            echo "::error::If ordinary smoke failed, an auto-revert PR has been opened — go merge it now."
          fi
          echo "::error::If deploy failed (migrations / edge functions), prod may be in a partial state. Investigate the step output above."
