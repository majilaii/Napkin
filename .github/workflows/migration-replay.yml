name: migration-replay

# From-scratch replayability check (2026-07-04, TICKET-100 class of bug).
#
# `supabase db push --linked` only applies NEW versions against the
# already-complete prod schema, so CI never notices when the chain stops
# replaying from zero — e.g. a branch with a backdated timestamp merging
# after a migration it references was already live (the 20260424100000 →
# entry_companions break), or SQL that never parsed in the first place
# (20260504000001's nested $$ quoting, history-repaired on prod).
#
# A broken chain blocks `supabase start` / `supabase db reset` for local
# dev, and will block staging/branching the day it exists. This job replays
# the FULL chain into a throwaway local database and fails if any migration
# errors.
#
# Rules this guard enforces (see CLAUDE.md → Migration blast-radius):
#   - Never rename an already-applied migration version (desyncs
#     supabase_migrations.schema_migrations on prod).
#   - Repair out-of-order references by editing file CONTENT so the chain
#     replays in version order (already-applied files never re-run on prod).

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/backfill/**'
      - 'scripts/classify-forward-only-release.sh'
      - 'scripts/test-forward-only-release-classifier.sh'
      - 'scripts/test-image-moderation-concurrency.sh'
      - '.github/workflows/migration-replay.yml'

concurrency:
  group: migration-replay-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration guard changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            'supabase/migrations/**' \
            'supabase/tests/**' \
            'scripts/backfill/**' \
            'scripts/classify-forward-only-release.sh' \
            'scripts/test-forward-only-release-classifier.sh' \
            'scripts/test-image-moderation-concurrency.sh' \
            '.github/workflows/migration-replay.yml'; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No migration guard changes
        if: steps.changes.outputs.run != 'true'
        run: echo "No migration or replay inputs changed; check is green."

      - uses: denoland/setup-deno@v2
        if: steps.changes.outputs.run == 'true'
        with:
          deno-version: v2.8.2

      - name: Assert completeness backfill contract
        if: steps.changes.outputs.run == 'true'
        # deno resolves npm:-specifier types through root node_modules;
        # without the install it dies on npm:@types/node before any test runs.
        run: |
          npm ci --ignore-scripts
          deno test --allow-env --frozen scripts/backfill/restaurant-completeness_test.ts

      - name: Assert forward-only release classifier
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/test-forward-only-release-classifier.sh

      - name: Duplicate timestamp guard
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/check-migration-timestamps.sh

      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.run == 'true'
        with:
          # Matches the version pinned in package.json — the same CLI the
          # local verification loop uses.
          version: 2.58.5

      - name: Replay all migrations into a throwaway database
        if: steps.changes.outputs.run == 'true'
        run: |
          # Isolated project dir: explicit project_id + ports so this can
          # never collide with any other supabase state on the runner. The
          # repo's config.toml stays the source of truth for the real local
          # stack; mirror its [db] major_version here (17, matching prod) so
          # the replay runs on the same Postgres major.
          mkdir -p /tmp/replay/supabase
          cp -R supabase/migrations /tmp/replay/supabase/migrations
          cat > /tmp/replay/supabase/config.toml <<'EOF'
          project_id = "migration-replay-guard"

          [db]
          port = 54329
          shadow_port = 54330
          major_version = 17
          EOF
          cd /tmp/replay
          # `db start` boots the db container and applies every migration in
          # version order — exactly what `supabase start` / `db reset` do on
          # a fresh machine. Any failing migration fails this step.
          supabase db start

      - name: Assert SQL contract specs
        if: steps.changes.outputs.run == 'true'
        # Runs from $GITHUB_WORKSPACE (ARCH-REVIEW N3) — the prior step's
        # `cd /tmp/replay` does NOT persist across steps, and supabase/tests/
        # was never copied there, so the spec file is referenced at its real
        # repo path. The db container started by `supabase db start` above stays
        # up (Docker, backgrounded) on the config.toml [db] port 54329 with the
        # default local superuser postgres/postgres. `ON_ERROR_STOP=1` turns any
        # failing ASSERT in the spec into a non-zero exit → red job.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/saves_visible_predicate.spec.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/profile_quick_takes.spec.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/user_taste_privacy.spec.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/socials_privacy.spec.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/people_lists_discovery.spec.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/restaurant_completeness.spec.sql
          bash supabase/tests/restaurant_completeness.concurrency.sh \
            "postgresql://postgres:postgres@127.0.0.1:54329/postgres"
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/image_moderation_b0.spec.sql
          # TICKET-217: was never wired in — Tests 1-8 incl. the
          # fn_create_entry_with_tables visibility-fallback contract.
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/entry_tables_leak.spec.sql
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/entry_companions_mutual_gate.spec.sql

      - name: Assert image-moderation multi-session invariants
        if: steps.changes.outputs.run == 'true'
        # These are real competing transactions coordinated at barriers: the
        # flag flip, atomic caps, 50-live quota, registry/GC row fences, scan
        # lease, and singleton job claim cannot be proved by a one-session DO.
        run: |
          bash scripts/test-image-moderation-concurrency.sh \
            "postgresql://postgres:postgres@127.0.0.1:54329/postgres"

      - name: Assert held B-2 transaction and activation contract
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          HOLD="supabase/migrations/20260716110000_b2_enforcement_grants.sql.b2-hold"
          test "$(grep -c '^BEGIN;$' "$HOLD")" -eq 1
          test "$(grep -c '^COMMIT;$' "$HOLD")" -eq 1

          # Inject a genuine mid-file failure after flag + privilege changes but
          # before policy drops. PostgreSQL must roll the whole explicit
          # transaction back (db push does not provide one for us).
          test "$(grep -c '^-- B2_ROLLBACK_TEST_POINT:' "$HOLD")" -eq 1
          awk '{ print } /^-- B2_ROLLBACK_TEST_POINT:/ { print "SELECT 1/0;" }' \
            "$HOLD" > /tmp/ticket-196-b2-forced-failure.sql
          set +e
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 -f /tmp/ticket-196-b2-forced-failure.sql
          rc=$?
          set -e
          test "$rc" -ne 0
          test "$(psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" -Atc \
            "select count(*) from public.moderation_config where enforce")" -eq 0
          test "$(psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" -Atc \
            "select count(*) from pg_policies where schemaname='public' and tablename='entry_photos' and policyname='entry_photos_insert'")" -eq 1

          # Apply the held file only to this throwaway replay DB, then test the
          # real post-activation privilege/order state.
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 -f "$HOLD"
          psql "postgresql://postgres:postgres@127.0.0.1:54329/postgres" \
            -v ON_ERROR_STOP=1 -f supabase/tests/image_moderation_b2.spec.sql
