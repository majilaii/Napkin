<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Napkin — Entry Detail · wireframes</title>

<!-- Napkin type -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --surface-table:       #fdf6ec;
    --surface-journal:     #f6ecdb;
    --surface-journal-low: #faf0e0;
    --surface-journal-hi:  #efe2ce;
    --surface-note:        #fffdf8;

    --ink-primary:   #1c1c19;
    --ink-secondary: #5c614d;
    --ink-muted:     #8a726c;

    --terracotta:         #a03f28;
    --terracotta-warm:    #c0573e;
    --terracotta-muted:   rgba(160, 63, 40, 0.08);
    --terracotta-border:  rgba(160, 63, 40, 0.10);

    --olive:       #5c614d;
    --olive-cream: #e0e5cc;

    --amber:       #825516;
    --amber-cream: #ffddb9;
    --amber-bright:#d97706;

    --sanguine:    #8a2a1a;

    --rule-warm:      rgba(221, 192, 186, 0.15);
    --rule-warm-soft: rgba(221, 192, 186, 0.30);
    --rule-ink-soft:  rgba(138, 114, 108, 0.25);

    --shadow-ambient: 0 8px 30px 0 rgba(28, 28, 25, 0.06);
    --shadow-note:    0 8px 30px 0 rgba(0, 0, 0, 0.03);
    --shadow-clip:    0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-phone:   0 24px 60px rgba(28,28,25,0.12), 0 2px 8px rgba(28,28,25,0.06), inset 0 0 0 1px rgba(28,28,25,0.04);

    --font-serif: 'Newsreader', Georgia, serif;
    --font-sans:  'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: #f0eee9;
    color: var(--ink-primary);
    -webkit-font-smoothing: antialiased;
  }

  /* Canvas layout */
  .canvas {
    padding: 64px 60px 120px;
    max-width: 100%;
  }
  .intro {
    max-width: 780px;
    margin-bottom: 56px;
  }
  .intro .kicker {
    font-size: 11px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--terracotta);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .intro h1 {
    font-family: var(--font-serif);
    font-size: 44px;
    line-height: 1.1;
    letter-spacing: -1px;
    color: var(--ink-primary);
    margin: 0 0 18px;
    font-weight: 500;
  }
  .intro h1 em { font-style: italic; font-weight: 500; }
  .intro p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink-secondary);
    max-width: 680px;
  }

  /* DC section */
  .section {
    margin-bottom: 96px;
  }
  .section-header {
    margin-bottom: 36px;
    max-width: 780px;
  }
  .section-header .number {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    color: var(--terracotta);
    margin-bottom: 6px;
  }
  .section-header h2 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.4px;
    margin: 0 0 10px;
  }
  .section-header h2 em { font-style: italic; }
  .section-header p {
    font-size: 14px;
    color: var(--ink-secondary);
    line-height: 1.55;
    margin: 0;
  }

  .artboards {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    flex-wrap: wrap;
    position: relative;
  }
  .artboard {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .artboard-label {
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .postit {
    max-width: 240px;
    padding: 14px 16px;
    background: #fff9e6;
    border: 1px solid rgba(184, 132, 42, 0.2);
    box-shadow: var(--shadow-clip);
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-primary);
    transform: rotate(-1.5deg);
    align-self: flex-start;
    margin-top: 40px;
  }
  .postit b { font-style: normal; font-family: var(--font-sans); font-weight: 700; }
  .postit em { font-weight: 600; }

  /* Phone shell */
  .phone {
    width: 360px;
    height: 780px;
    background: var(--surface-table);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow-phone);
    font-family: var(--font-sans);
    color: var(--ink-primary);
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 44px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .status-bar .dots { font-size: 11px; opacity: 0.6; }

  .screen {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* Hero */
  .hero {
    width: 100%;
    height: 240px;
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .hero-scrim {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(to bottom, rgba(28,28,25,0.4), rgba(28,28,25,0));
  }
  .hero-chrome {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .hero-btn {
    width: 32px;
    height: 32px;
    border-radius: 999px;
    background: rgba(252, 249, 244, 0.9);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-primary);
    font-size: 16px;
    box-shadow: var(--shadow-clip);
  }
  .hero-btn-cluster {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .hero-action-pill {
    height: 32px;
    border-radius: 999px;
    background: rgba(252, 249, 244, 0.9);
    backdrop-filter: blur(12px);
    padding: 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-primary);
    font-weight: 500;
    box-shadow: var(--shadow-clip);
  }

  /* Bottom-right action pill (Instagram story-style) */
  .bottom-actions {
    position: absolute;
    right: 16px;
    bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 18px;
    background: rgba(252, 249, 244, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 999px;
    box-shadow:
      0 6px 22px rgba(28, 28, 25, 0.12),
      0 1px 2px rgba(28, 28, 25, 0.06),
      inset 0 0 0 1px rgba(28, 28, 25, 0.05);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-primary);
    z-index: 5;
  }
  .bottom-actions .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--ink-primary);
    letter-spacing: 0.1px;
  }
  .bottom-actions .count {
    color: var(--ink-secondary);
    font-weight: 600;
    font-size: 12px;
  }
  .bottom-actions .sep {
    width: 1px;
    height: 14px;
    background: rgba(28, 28, 25, 0.12);
  }

  /* Body */
  .body {
    padding: 24px 22px 0;
  }
  .kicker {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.4px;
    color: var(--ink-muted);
    font-weight: 500;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 10px;
    gap: 12px;
  }
  .title-block { flex: 1; min-width: 0; }
  .restaurant-name {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    line-height: 38px;
    letter-spacing: -0.4px;
    color: var(--ink-primary);
    margin: 0;
  }
  .address {
    font-family: var(--font-sans);
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
    letter-spacing: 0.2px;
  }
  .rating-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding-top: 4px;
  }
  .rating-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    line-height: 36px;
    letter-spacing: -0.6px;
  }
  .rating-slash {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: 2px;
  }
  .prose {
    font-family: var(--font-serif);
    font-size: 18px;
    line-height: 28px;
    color: var(--ink-primary);
    margin-top: 32px;
  }

  /* Social tail (for table entries) */
  .social-tail {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--rule-warm-soft);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-muted);
  }
  .social-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-secondary);
    font-weight: 500;
    letter-spacing: 0.2px;
  }
  .social-btn svg { display: block; }
  .social-sep { color: var(--rule-warm-soft); }

  /* Comment row (minimal) */
  .comment {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-top: 18px;
  }
  .avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: linear-gradient(135deg, #d4a57c, #8a5a3e);
    flex-shrink: 0;
  }
  .comment-body {
    flex: 1;
    min-width: 0;
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-primary);
  }
  .comment-author {
    font-weight: 600;
    margin-right: 6px;
  }
  .comment-time {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 2px;
  }

  /* Direction C — stamped slip */
  .slip-kicker {
    font-family: var(--font-sans);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
    padding: 36px 22px 0;
  }
  .slip-name {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 38px;
    line-height: 42px;
    letter-spacing: -0.5px;
    margin: 10px 22px 4px;
  }
  .slip-meta {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0 22px;
    font-weight: 600;
  }
  .slip-rating-row {
    margin: 26px 22px 0;
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 8px;
  }
  .slip-star {
    color: var(--amber-bright);
    font-size: 22px;
    line-height: 1;
  }
  .slip-rating-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 32px;
    letter-spacing: -0.4px;
  }
  .slip-prose {
    font-family: var(--font-serif);
    font-size: 17px;
    line-height: 27px;
    color: var(--ink-primary);
    padding: 28px 22px 0;
  }
  .slip-photo {
    width: 220px;
    aspect-ratio: 4/3;
    background-size: cover;
    background-position: center;
    border-radius: 4px;
    box-shadow: var(--shadow-clip), 0 6px 20px rgba(28,28,25,0.08);
    margin: 32px auto 0;
    transform: rotate(-2deg);
    border: 6px solid var(--surface-note);
  }
  .slip-tail {
    margin-top: 48px;
    padding: 18px 22px 0;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-muted);
  }

  /* Annotations */
  .annot-row {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
</style>

// Heart icon
// ─────────────────────────────────────────────────────────────────
function Heart({ filled = false, color = 'var(--ink-muted)', size = 13 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={filled ? color : 'none'}
      stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────────
// Reusable phone primitives
// ─────────────────────────────────────────────────────────────────
function PhoneShell({ children, bg = 'var(--surface-table)' }) {
  return (
    <div className="phone" style={{ background: bg }}>
      <div className="status-bar">
        <span>9:41</span>
        <span className="dots">●●●●</span>
      </div>
      <div className="screen">{children}</div>
    </div>
  );
}

function Artboard({ label, children }) {
  return (
    <div className="artboard">
      <div className="artboard-label">{label}</div>
      {children}
    </div>
  );
}

function PostIt({ children, rotate = -1.5 }) {
  return (
    <div className="postit" style={{ transform: `rotate(${rotate}deg)` }}>
      {children}
    </div>
  );
}

      <div className="slip-kicker">Fri · 18 Apr · two days ago</div>
      <h1 className="slip-name">Five Guys</h1>
      <div className="slip-meta">American · Upper West Side</div>

      <div className="slip-rating-row">
        <span className="slip-star">★</span>
        <span className="slip-rating-num">1.5</span>
      </div>

      <div className="slip-prose">
        &mdash; the fries were cold. i don&apos;t get the hype. maybe a bad night.
      </div>

      <div className="slip-photo" style={{ backgroundImage: `url(${HERO_FIVE_GUYS})` }} />
    </PhoneShell>
  );
}

function CDirectionTable() {
  return (
    <PhoneShell>
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0,
        padding: '12px 22px', display: 'flex',
        justifyContent: 'space-between',
        zIndex: 2,
      }}>
        <div style={{ fontSize: 18, color: 'var(--ink-muted)' }}>‹</div>
        <div style={{ fontSize: 18, color: 'var(--ink-muted)' }}>⋯</div>
      </div>

      <div className="slip-kicker">Sun · 14 Apr · Clara · four days ago</div>
      <h1 className="slip-name">Carbone</h1>
      <div className="slip-meta">Italian · Greenwich Village</div>

      <div className="slip-rating-row">
        <span className="slip-star">★</span>
        <span className="slip-rating-num">4.5</span>
      </div>

      <div className="slip-prose">
        &mdash; the spicy rigatoni lives up to the reputation. service felt theatrical in the right way.
      </div>

      <div className="slip-photo" style={{ backgroundImage: `url(${HERO_CARBONE})`, transform: 'rotate(1.5deg)' }} />

      <div className="slip-tail">
        <span className="social-btn">
          <Heart filled color="var(--sanguine)" /> <span style={{ color: 'var(--ink-secondary)' }}>3</span>
        </span>
        <span className="social-sep">·</span>
        <span className="social-btn">reply</span>
      </div>
    </PhoneShell>
  );
}

// ─────────────────────────────────────────────────────────────────
// Canvas
// ─────────────────────────────────────────────────────────────────
function Canvas() {
  return (
    <div className="canvas">
      <div className="intro">
        <div className="kicker" style={{
          fontSize: 11, letterSpacing: '1.4px', textTransform: 'uppercase',
          color: 'var(--terracotta)', fontWeight: 700, marginBottom: 12,
        }}>Entry Detail · wireframes</div>
        <h1>
          A page you&apos;d <em>read</em>, not a dashboard you&apos;d fill in.
        </h1>
        <p>
          Three directions, each stripped down to what an entry actually <em>is</em>:
          the rating, the place, the thing you wrote. Everything else
          (edit, rate the details, dish, breakdown, reactions, composer)
          collapses behind a <b>⋯</b> menu or vanishes entirely on personal-table entries.
          Left column is your own solo journal entry (Five Guys, 1.5). Right column is a friend&apos;s log on a shared Table (Clara&apos;s Carbone, 4.5).
        </p>
      </div>

      {/* A */}
      <div className="section">
        <div className="section-header">
          <div className="number">A</div>
          <h2><em>The journal page</em></h2>
          <p>
            The prose is the document. Nothing else competes. Edits live behind the <b>⋯</b> in the top-right.
            Personal entries have <em>zero</em> social UI. Table entries get a single quiet tail &mdash; <Heart filled color="var(--sanguine)" size={11} />&nbsp;count &nbsp;·&nbsp; reply &nbsp;&mdash; centered under a hairline.
            Comments render as plain rows, no &ldquo;Replies&rdquo; label. Reply composer bottom-docks when tapped (like iMessage).
          </p>
        </div>
        <div className="artboards">
          <Artboard label="A · Personal entry">
            <ADirectionPersonal />
          </Artboard>
          <Artboard label="A · Table entry">
            <ADirectionTable />
          </Artboard>
          <PostIt rotate={-2}>
            The <b>⋯</b> menu holds: <em>edit rating · edit note · add dish · rate the details · delete</em>. Tap the prose or rating directly to edit in place. No &ldquo;+&nbsp;add a note&rdquo; links.
          </PostIt>
        </div>
      </div>

      {/* B */}
      <div className="section">
        <div className="section-header">
          <div className="number">B <span style={{ color: 'var(--olive)', fontStyle: 'italic' }}>— chosen</span></div>
          <h2><em>Floating bottom-right actions</em></h2>
          <p>
            Same journal page. Like-count and reply live in a single <b>warm-cream pill</b> docked at the <b>bottom-right</b>,
            floating above content (Instagram-story pattern). Stays visible as you scroll through prose and comments &mdash; no hunting for actions.
            Personal entries have no pill. Top-right stays minimal: <b>‹</b> and <b>⋯</b> only.
          </p>
        </div>
        <div className="artboards">
          <Artboard label="B · Personal entry">
            <BDirectionPersonal />
          </Artboard>
          <Artboard label="B · Table entry">
            <BDirectionTable />
          </Artboard>
          <PostIt rotate={1.5}>
            Pill spec: <em>warm cream (88% opacity) · 16px blur · ambient shadow · inset hairline</em>. Tap <b>♡</b> to like, long-press for emoji picker. Tap <b>reply</b> to bottom-dock a composer (iMessage pattern).
          </PostIt>
        </div>
      </div>

      {/* C */}
      <div className="section">
        <div className="section-header">
          <div className="number">C</div>
          <h2><em>The stamped slip</em></h2>
          <p>
            No hero photo at the top. The entry reads like a page torn from a notebook: dateline, italic name, tiny uppercase meta, the rating pinned right, prose, then the photo &mdash; <em>if there is one</em> &mdash; as a tilted scrapbook clip lower down.
            Most editorial, least photographic. Works elegantly even on photoless entries (lists, notes, quick logs).
          </p>
        </div>
        <div className="artboards">
          <Artboard label="C · Personal entry">
            <CDirectionPersonal />
          </Artboard>
          <Artboard label="C · Table entry">
            <CDirectionTable />
          </Artboard>
          <PostIt rotate={-1}>
            Chrome (<b>‹ ⋯</b>) floats at the very top &mdash; no action bar, no hero scrim. The <em>slip</em> is meant to feel like you&apos;re reading your own handwriting.
          </PostIt>
        </div>
      </div>

      {/* Decision rubric */}
      <div className="intro" style={{ marginTop: 80 }}>
        <div className="kicker" style={{
          fontSize: 11, letterSpacing: '1.4px', textTransform: 'uppercase',
          color: 'var(--olive)', fontWeight: 700, marginBottom: 12,
        }}>How to choose</div>
        <h1 style={{ fontSize: 28, letterSpacing: '-0.4px' }}>
          <em>A</em> &mdash; safest, Letterboxd-native.<br />
          <em>B</em> &mdash; same page, less tail.<br />
          <em>C</em> &mdash; boldest, editorial-first.
        </h1>
        <p>
          <b>A</b> keeps hero photography as the top moment (matching current entry-detail behavior) and parks social actions at the bottom.
          <b style={{ marginLeft: 6 }}>B</b> is the same screen with reactions/reply pulled into the hero chrome &mdash; no tail to scroll past, but action chrome lives over imagery.
          <b style={{ marginLeft: 6 }}>C</b> demotes the hero photo to a scrapbook clip below the prose. Feels most like a journal; weakest for photo-centric entries (food shots work less well as decorative clips).
        </p>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Canvas />);
</script>
