<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napkin Onboarding Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Napkin Background Layer -->
    <div class="napkin-background">
        <div class="napkin-texture"></div>
        <div class="restaurant-entries" id="entries"></div>
    </div>

    <!-- Onboarding Card (Foreground) -->
    <div class="onboarding-container">
        <div class="onboarding-card">
            <div class="step-indicator">
                <span class="step active"></span>
                <span class="step"></span>
                <span class="step"></span>
            </div>
            <h1>Welcome to Napkin</h1>
            <p>Your dining journal for memorable meals with the people you love.</p>
            <button class="next-btn" id="nextBtn">Get Started</button>
        </div>
    </div>

    <script src="animation.js"></script>
</body>
</html>
